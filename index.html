<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>三维果岭坡度查看器</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>三维果岭坡度查看器</h1>
        <div id="status">请加载高程 CSV，或打开演示果岭</div>
      </header>

      <main>
        <div id="view-wrap">
          <div id="view"></div>
          <div id="hud">
            <div id="slope-readout"></div>
            <div id="info"></div>
          </div>
        </div>

        <aside id="panel">
          <section class="group">
            <h2>数据</h2>
            <label class="file-btn">
              导入高程 CSV
              <input type="file" id="csv-input" accept=".csv,text/csv" hidden />
            </label>
            <button id="demo-btn">加载演示果岭</button>
          </section>

          <section class="group">
            <h2>草面参数</h2>
            <label>Stimp 读数 <span id="stimp-val">11.0</span> 英尺
              <input type="range" id="stimp" min="6" max="14" step="0.5" value="11" />
            </label>
            <label>修剪高度 <span id="mow-val">3.2</span> mm
              <input type="range" id="mow" min="2" max="6" step="0.1" value="3.2" />
            </label>
          </section>

          <section class="group">
            <h2>光照</h2>
            <label>当地时刻 <span id="time-val">10:00</span>
              <input type="range" id="time" min="6" max="18" step="0.25" value="10" />
            </label>
            <label>垂直夸张 <span id="vscale-val">4×</span>
              <input type="range" id="vscale" min="1" max="8" step="0.5" value="4" />
            </label>
          </section>

          <section class="group">
            <h2>输出</h2>
            <button id="shot-btn">截图（带图例 PNG）</button>
          </section>

          <section class="group help">
            <h2>操作</h2>
            <p>单指拖动白球/黑洞改位置；空白处拖动旋转视角；双指或滚轮缩放。箭头指下坡，三条线为轻/中/重力度滚动轨迹，虚线为滚出果岭后的长草段。</p>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
